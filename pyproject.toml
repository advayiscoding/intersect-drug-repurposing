[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimers-repurpose"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "networkx==3.6.1", "requests>=2.32,<3", "pyarrow>=19,<24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
repurpose = "repurpose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
